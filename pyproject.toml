[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "selgate"
version = "0.1.0"
description = "Illumination-Aware Selective Gating for Low-Light Image Enhancement (Retinexformer + interpretable output gate)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "pyyaml>=6.0",
    "pillow>=9.0",
    "einops>=0.6",
]

[project.optional-dependencies]
# optional quality metrics used in the evaluation protocol
metrics = [
    "lpips>=0.1.4",
    "pyiqa>=0.1.9",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
