# Ablation #4: frozen backbone — train the ~20K-param gate only.
# (Only meaningful when model.backbone.pretrained points at Retinexformer weights.)
name: ablation_frozen_backbone
seed: 0

data:
  root: null
  split_file: null
  val_fraction: 0.05
  split_seed: 0
  crop_size: 128
  batch_size: 8
  num_workers: 2
  augment: true

model:
  backbone:
    n_feat: 40
    stage: 1
    num_blocks: [1, 2, 2]
    pretrained: null      # <-- set this to the Retinexformer LOL-v1 checkpoint
  gate:
    enabled: true
    granularity: pixel
    width: 32
    depth: 4
    illum: max
    stride: 8
  freeze_backbone: true   # <-- gate-only training

train:
  iters: 30000
  lr: 2.0e-4
  lr_min: 1.0e-6
  amp: true
  grad_clip: 1.0
  log_every: 500
  val_every: 2500
  max_val_images: null
  out_dir: null
  device: null

loss:
  ssim_weight: 0.2
  tv_lambda: 0.01
  illum_lambda: 0.1
  illum_mode: bce
  gate_illum_mode: max
