# Control: plain Retinexformer, gate OFF (ablation #1 — the baseline).
name: baseline
seed: 0

data:
  root: null              # auto: data/LOL-v1 locally, /kaggle/input/* on Kaggle (or SELGATE_LOL_ROOT)
  split_file: null        # default: configs/split_lol_v1.json (committed once created)
  val_fraction: 0.05      # ~24 of the 485 train images; test-15 never touched
  split_seed: 0
  crop_size: 128          # official Retinexformer LOL-v1 patch size
  batch_size: 8
  num_workers: 2
  augment: true           # random crop + h/v flips

model:
  backbone:               # official LOL-v1 hyperparameters (1.6M params)
    n_feat: 40
    stage: 1
    num_blocks: [1, 2, 2]
    pretrained: null      # optional path to Retinexformer LOL-v1 weights
  gate:
    enabled: false        # <-- control: no gate
    granularity: pixel
    width: 32
    depth: 4
    illum: max
    stride: 8
  freeze_backbone: false

train:
  iters: 150000           # official schedule; ~2-4 h on a 24 GB GPU
  lr: 2.0e-4
  lr_min: 1.0e-6
  amp: true
  grad_clip: 1.0
  log_every: 500
  val_every: 5000
  max_val_images: null
  out_dir: null
  device: null

loss:
  ssim_weight: 0.2
  tv_lambda: 0.01         # λ_s — irrelevant when gate is off
  illum_lambda: 0.1       # λ_i — irrelevant when gate is off
  illum_mode: bce
  gate_illum_mode: max
